name: Deploy to GitHub Pages # 워크플로우의 이름

on:
  push:
    branches:
      - main # ⭐️⭐️⭐️ 중요! 네 주력 브랜치 이름으로 변경 (main 또는 master) ⭐️⭐️⭐️

jobs:
  build-and-deploy: # 빌드 및 배포 작업을 정의
    runs-on: ubuntu-latest # 작업이 실행될 환경 (우분투 최신 버전)

    steps:
      - name: Checkout code # 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Node.js # Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ⭐️⭐️⭐️ 네 프로젝트에 사용되는 Node.js 버전에 맞춰서 변경 ⭐️⭐️⭐️

      - name: Set up Git user # Git 사용자 정보 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies # npm 의존성 패키지 설치
        run: npm install

      - name: Build and Deploy to GitHub Pages # 프로젝트 빌드 및 GitHub Pages 배포
        run: | # ⭐️⭐️⭐️ 이 부분을 다시 수정해 줘! ⭐️⭐️⭐️
          npm run build
          # --repo 옵션을 사용하여 GITHUB_TOKEN을 URL에 직접 포함시켜 전달합니다.
          # 이는 가장 확실하게 인증 정보를 gh-pages에 전달하는 방법 중 하나입니다.
          npx gh-pages --dotfiles --no-history -d dist --repo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        # 이전 env: 섹션에 GH_TOKEN을 정의했다면 그 부분은 삭제!