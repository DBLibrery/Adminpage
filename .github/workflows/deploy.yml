name: Deploy to GitHub Pages # 워크플로우의 이름

on:
  push:
    branches:
      - main # ⭐️⭐️⭐️ 중요! 네 주력 브랜치 이름으로 변경 (main 또는 master) ⭐️⭐️⭐️

jobs:
  build-and-deploy: # 빌드 및 배포 작업을 정의
    runs-on: ubuntu-latest # 작업이 실행될 환경 (우분투 최신 버전)

    steps:
      - name: Checkout code # 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          # gh-pages 액션이 이전 커밋 기록을 필요로 할 수 있으므로 fetch-depth를 0으로 설정합니다.
          fetch-depth: 0 

      - name: Set up Node.js # Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ⭐️⭐️⭐️ 네 프로젝트에 사용되는 Node.js 버전에 맞춰서 변경 ⭐️⭐️⭐️

      - name: Set up Git user # Git 사용자 정보 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies # npm 의존성 패키지 설치
        run: npm install

      - name: Build and Deploy to GitHub Pages # 프로젝트 빌드 및 GitHub Pages 배포
        # ⭐️⭐️⭐️ 이 부분을 수정해 줘! GH_TOKEN=을 앞에 붙여야 gh-pages가 토큰을 인식해. ⭐️⭐️⭐️
        run: |
          npm run build
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} npx gh-pages --dotfiles --no-history -d dist
        # 이전 버전에서 env: 섹션에 GH_TOKEN을 넣었다면 이제는 필요 없어 (삭제)
        # env:
        #   GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 이 부분은 위 run: 명령어로 직접 전달하므로 삭제!