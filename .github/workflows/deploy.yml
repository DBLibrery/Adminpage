name: Deploy to GitHub Pages # 워크플로우의 이름

on:
  push:
    branches:
      - main # ⭐️⭐️⭐️ 중요! 네 주력 브랜치 이름으로 변경 (main 또는 master) ⭐️⭐️⭐️

jobs:
  build-and-deploy: # 빌드 및 배포 작업을 정의
    runs-on: ubuntu-latest # 작업이 실행될 환경 (우분투 최신 버전)

    steps:
      - name: Checkout code # 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          # gh-pages 액션이 이전 커밋 기록을 필요로 할 수 있으므로 fetch-depth를 0으로 설정합니다.
          # 단, 저장소 크기가 크면 시간이 오래 걸릴 수 있습니다.
          # 만약 문제가 생기면 이 라인(fetch-depth: 0)을 제거하고 테스트해 볼 수 있습니다.
          fetch-depth: 0 

      - name: Set up Node.js # Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ⭐️⭐️⭐️ 네 프로젝트에 사용되는 Node.js 버전에 맞춰서 변경 ⭐️⭐️⭐️

      - name: Install dependencies # npm 의존성 패키지 설치
        run: npm install

      - name: Build and Deploy to GitHub Pages # 프로젝트 빌드 및 GitHub Pages 배포
        run: | # 여러 명령어를 실행할 때 사용
          npm run build # Vue 프로젝트 빌드 (결과물은 dist 폴더에 생성)
          # gh-pages 패키지를 사용하여 GitHub Pages에 배포
          # --dotfiles: .nojekyll 같은 숨김 파일도 포함
          # --no-history: gh-pages 브랜치의 기록을 새로 시작하여 용량 관리 (선택 사항)
          # -d dist: 배포할 빌드 폴더 지정
          # -r: 원격 저장소 URL 지정 (GITHUB_TOKEN을 사용하여 인증)
          npx gh-pages --dotfiles --no-history -d dist -r https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        env:
          # gh-pages가 GitHub API에 접근할 때 사용할 토큰 (자동 생성됨)
          # GITHUB_TOKEN은 GitHub Actions에서 자동으로 제공되며, gh-pages가 인증에 사용
          # private 저장소에 배포 시 필수 (public 저장소는 때때로 생략 가능하나 명시하는 것이 안전)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 