name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # ⭐️⭐️⭐️ 중요! 네 주력 브랜치 이름으로 변경 (main 또는 master) ⭐️⭐️⭐️

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ⭐️⭐️⭐️ 네 프로젝트에 사용되는 Node.js 버전에 맞춰서 변경 ⭐️⭐️⭐️

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm install

      - name: Build and Deploy to GitHub Pages
        run: |
          npm run build
          # --repo 옵션을 사용하여 GITHUB_TOKEN을 URL에 직접 포함시켜 전달합니다.
          npx gh-pages --dotfiles --no-history -d dist --repo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"